<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SHO Dashboard | Seva360</title>

<!-- Leaflet CSS -->
<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet/dist/leaflet.css"
/>

<style>
html, body {
    height: 100%;
    margin: 0;
    font-family: Arial, sans-serif;
}

/* TOP BAR */
.top-bar {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 60px;
    background: #0b5ed7;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    z-index: 1000;
}

.ps-title {
    font-size: 18px;
    font-weight: bold;
}

.profile {
    position: absolute;
    right: 15px;
    display: flex;
    align-items: center;
}

.profile img {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    border: 2px solid white;
}

.profile-name {
    margin-left: 8px;
    font-size: 12px;
}

/* MAP */
#map {
    width: 100vw;
    height: 100vh;
    z-index: 1;
}

.next-btn {
    position: fixed;
    bottom: 20px;
    right: 20px;
    background: #0b5ed7;
    color: white;
    border-radius: 50%;
    width: 55px;
    height: 55px;
    font-size: 26px;
    border: none;
    cursor: pointer;

    z-index: 2000;
    box-shadow: 0 4px 10px rgba(0,0,0,0.4);

    /* 🔥 smooth animation */
    transition: transform 0.2s ease, box-shadow 0.2s ease;
}

/* 🟢 cursor jate hi */
.next-btn:hover {
    transform: scale(1.15);   /* thoda bada */
    box-shadow: 0 6px 15px rgba(0,0,0,0.6);
}

</style>
</head>
User.find({
    role: "user",
    allowedForMap: true
}).select("fullName phone location");
setInterval(loadUsersOnMap, 5000);
<script>
document.addEventListener("DOMContentLoaded", () => {
    const btn = document.getElementById("nextBtn");
    
    btn.addEventListener("click", () => {
        console.log("Arrow clicked");
       
    });
});
</script>

<body>

<div class="top-bar">
    <div class="ps-title">PS JAHANGIRBAD BHOPAL</div>
    <div class="profile">
        <img id="shoPhoto" src="https://via.placeholder.com/40">
        <div class="profile-name" id="shoName">SHO</div>
    </div>
</div>

<div id="map"></div>

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>
// ✅ MAP INIT
const map = L.map("map").setView([23.2599, 77.4126], 12);

L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    attribution: "© OpenStreetMap"
}).addTo(map);

// ✅ TEST MARKER
L.marker([23.2599, 77.4126])
 .addTo(map)
 .bindPopup("User Location Test");

// ✅ SHO INFO
fetch("/api/me")
  .then(res => res.json())
  .then(user => {
      document.getElementById("shoName").innerText =
          user.fullName || user.username || "SHO";
  })
  .catch(() => {});
</script>
<script>
fetch("/api/sho-users")
  .then(res => res.json())
  .then(users => {
    users.forEach(user => {
      if (!user.location) return;
      const popupHTML = `
        <div style="font-size:14px">
          <b>${user.fullName || user.username}</b><br>
          📞 ${user.phone || "N/A"}<br>
          📍 ${user.location.place || ""}<br><br>

          <a href="tel:${user.phone}"
             style="
               display:inline-block;
               padding:6px 10px;
               background:#0b5ed7;
               color:white;
               text-decoration:none;
               border-radius:5px;
             ">
             📞 CALL
          </a>
        </div>
      `;

      L.marker([user.location.lat, user.location.lng])
        .addTo(map)
        .bindPopup(popupHTML);
    });

  })
  .catch(err => console.error(err));
</script>
<button id="nextBtn" class="next-btn">➜</button>
<script>
document.addEventListener("DOMContentLoaded", () => {
    const btn = document.getElementById("nextBtn");

    btn.onclick = () => {
        window.location.assign("/sho_man_das.html");
    };
});
</script>
</body>
</html>
